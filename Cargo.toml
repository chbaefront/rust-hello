[package]
name = "rust-hello"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json", "multipart", "macros"]}
serde = { version = "1.0.229", features = ["derive"]}
tokio = { version = "1.53.2", features = ["full"] }
serde_json = "1.0.154"
axum-extra = { version = "0.12.6", features = ["typed-header"]}
tower-http = { version = "0.7.1", features = ["cors"]}

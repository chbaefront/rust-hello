[package]
name = "rust-axum-orm"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
dotenvy = "0.15.7"
sea-orm = { version = "2.0.4", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
  "macros",
  "serde",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
